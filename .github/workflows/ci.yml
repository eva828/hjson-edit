name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}

      - name: Format
        run: nix develop -c cargo fmt --all -- --check

      - name: Clippy
        run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: nix develop -c cargo test --all-features

      - name: Doc tests
        run: nix develop -c cargo test --doc

      - name: Documentation
        run: nix develop -c sh -c 'RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features'

      - name: Missing docs
        run: nix develop -c sh -c 'RUSTFLAGS="-W missing_docs" cargo check --lib'

      - name: Package
        run: nix develop -c cargo package

      - name: Examples
        run: |
          nix develop -c cargo run --quiet --example basic_usage
          nix develop -c cargo run --quiet --example comments_and_styles

      - name: Flake check
        run: nix flake check --no-build

      - name: Nix build
        run: nix build --print-out-paths .#default

  conformance:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-conformance-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-conformance-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Official test assets (78)
        run: nix develop -c cargo test --features net-conformance --test conformance_assets -- --ignored

      - name: Corpus parse (542)
        run: nix develop -c cargo test --features net-corpus --test tmlhonyaku_parse -- --ignored

      - name: Corpus diff (542)
        run: nix develop -c tools/corpus_diff.sh

      - name: Fuzz diff (2000)
        run: nix develop -c env SEED=20260101 COUNT=2000 tools/diff_fuzz.sh
