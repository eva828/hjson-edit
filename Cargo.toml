[package]
name = "hjson-edit"
version = "0.1.0"
edition = "2021"
description = "HJSON parser and editor that preserves positions and comments"
license = "MIT"
repository = "https://github.com/eva828/hjson-edit"
readme = "README.md"
keywords = ["hjson", "parser", "formatter", "editor", "cli"]
categories = ["parser-implementations", "command-line-utilities"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
rowan = "0.15"
thiserror = "1"
line-index = "0.1.2"
clap = { version = "4.5.60", optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[[bin]]
name = "hjson-edit"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "hjson_edit"
