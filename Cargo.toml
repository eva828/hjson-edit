[package]
name = "hjson-edit"
version = "0.1.0"
edition = "2021"
description = "HJSON parser and editor that preserves positions and comments"
license = "MIT"
repository = "https://github.com/eva828/hjson-edit"
readme = "README.md"
keywords = ["hjson", "parser", "formatter", "editor", "cli"]
categories = ["parser-implementations", "command-line-utilities"]
# crates.io には公開しないが、package の内容を意図どおりに保つ
exclude = [".envrc", "flake.nix", "flake.lock", "tools/", ".github/"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]
# ネットワーク越しのコーパステスト専用。既定では reqwest 系をビルドしない
net-corpus = ["dep:reqwest", "dep:serde_json"]
# hjson-cs 公式テスト資産との適合テスト専用。既定では reqwest をビルドしない
net-conformance = ["dep:reqwest"]
# 準拠検証用の開発ツール（canon など）。既定ではビルドしない
dev-tools = []

[dependencies]
rowan = "0.15"
thiserror = "1"
line-index = "0.1.2"
clap = { version = "4.5.60", optional = true }
anyhow = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[[bin]]
name = "hjson-edit"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "canon"
path = "src/bin/canon.rs"
required-features = ["dev-tools"]

[lib]
name = "hjson_edit"
