[package]
name = "hjson-edit"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
rowan = "0.15"
thiserror = "1"
line-index = "0.1.2"
clap = { version = "4.5.60", optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
insta = { version = "1.46.3", features = ["yaml"] }
pretty_assertions = "1.4"
proptest = "1.10.0"
line-index = "0.1.2"
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[[bin]]
name = "hjson-edit"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "hjson_edit"
